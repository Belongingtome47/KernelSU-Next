name: Build KernelSU-Next Manager & Payload

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build Signed Release APK'
        required: false
        type: boolean
        default: true

jobs:
  build-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v3
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Build ksud / ksud-next for aarch64-linux-android
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang
        run: |
          echo "Building ksud binary..."
          cd userspace
          cargo build --release --target aarch64-linux-android
          
          echo "Staging compiled binary into manager payloads directory..."
          mkdir -p ../manager/app/src/main/assets/payloads/ksud/
          cp target/aarch64-linux-android/release/ksud ../manager/app/src/main/assets/payloads/ksud/ksud-next
          chmod +x ../manager/app/src/main/assets/payloads/ksud/ksud-next
          
          # Also stage as standard ksud if required by build scripts
          cp target/aarch64-linux-android/release/ksud ../manager/app/src/main/assets/payloads/ksud/ksud
          chmod +x ../manager/app/src/main/assets/payloads/ksud/ksud

      - name: Verify Staged Payloads
        cd manager
        run: |
          chmod +x gradlew
          ./gradlew :app:verifyPayloads

      - name: Build Manager APK (Release)
        working-directory: ./manager
        run: |
          ./gradlew assembleRelease

      - name: Upload Manager APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-next-manager-release
          path: manager/app/build/outputs/apk/release/app-release.apk
