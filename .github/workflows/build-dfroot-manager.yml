name: Build S26U DFRoot Manager (KernelSU-Next)

on:
  workflow_dispatch:

jobs:
  build-all-in-one:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Checkout snothin/KernelSU-Next
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17 & Android SDK/NDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & Build Dependencies
        run: |
          sdkmanager --install "ndk;27.0.12077973" "build-tools;35.0.0" "platforms;android-35"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          sudo apt-get update && sudo apt-get install -y bc bison build-essential cpio curl flex git libelf-dev libssl-dev lld llvm python3

      - name: Setup Rust & cargo-ndk
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build kernelsu.ko for android16-6.12
        env:
          EXPECTED_NEXT_SIZE: ${{ secrets.EXPECTED_NEXT_SIZE }}
          EXPECTED_NEXT_HASH: ${{ secrets.EXPECTED_NEXT_HASH }}
        run: |
          # Clone minimal GKI 6.12 kernel build environment or use repo's LKM build script
          # If snothin's repo includes scripts/build_lkm.sh, invoke it for android16-6.12:
          if [ -f "scripts/build_lkm.sh" ]; then
            chmod +x scripts/build_lkm.sh
            ./scripts/build_lkm.sh android16-6.12
          else
            # Fallback: Use standard DDK / GKI 6.12 prebuilts if defined in build-lkm.yml
            echo "Checking existing LKM build structure..."
          fi

      - name: Stage kernelsu.ko for Embedding into ksud
        run: |
          mkdir -p userspace/ksud/bin/aarch64
          # Copy the compiled android16-6.12 kernelsu.ko so Rust embeds it via late-load
          find . -name "kernelsu.ko" -exec cp {} userspace/ksud/bin/aarch64/kernelsu.ko \;
          ls -la userspace/ksud/bin/aarch64/kernelsu.ko

      - name: Compile ksud (arm64-v8a) with Embedded LKM
        run: |
          cd userspace/ksud
          cargo ndk -t arm64-v8a build --release
          mkdir -p ../../manager/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/ksud ../../manager/app/src/main/jniLibs/arm64-v8a/libksud.so

      - name: Decode Keystore & Build Signed Manager APK
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > manager/app/key.jks
          cd manager
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/key.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload DFRoot-Ready KernelSU-Next APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-S26U-DFRoot
          path: manager/app/build/outputs/apk/release/*.apk
